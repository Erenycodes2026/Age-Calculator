<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="icon">
            <img src="Cake.jpg" alt="Age Calculator">
        </div>

        <h1>Age Calculator</h1>

        <p class="subtitle">
            Discover your age in seconds 🍃
        </p>

        <label for="birthYear">
            Birth Year
        </label>

        <div class="input-box">

            <input
                type="number"
                id="birthYear"
                placeholder="Enter your Birth Year">

            <span class="calendar">📅</span>

        </div>

        <button id="calculateBtn">

            <span>Calculate Age</span>

            <span class="arrow">→</span>

        </button>

        <div class="divider">
            <span>✦</span>
        </div>

        <div id="result">

            <p class="result-title">
                🍃 Your age is 🍃
            </p>

            <h2 id="ageNumber">--</h2>

            <p class="years">
                years old!
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
